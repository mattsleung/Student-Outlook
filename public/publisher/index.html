<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Student Outlook Owner Publisher</title>
    <script>
      if (window.location.hostname === "mattsleung.github.io") {
        const publisherUrl = new URL(
          "https://student-outlook-auth.netlify.app/publisher/",
        );
        publisherUrl.hash = window.location.hash;
        window.location.replace(publisherUrl.toString());
      }
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      window.CMS.init();
    </script>
  </body>
