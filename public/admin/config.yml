backend:
  name: github
  repo: mattsleung/Student-Outlook
  branch: main
  open_authoring: true
  squash_merges: true
  # Netlify securely holds the GitHub OAuth secret. Never place that secret in
  # this public configuration file.
  site_domain: student-outlook-auth.netlify.app
  base_url: https://student-outlook-auth.netlify.app
  auth_endpoint: .netlify/functions/auth

site_url: https://mattsleung.github.io/Student-Outlook/
display_url: https://mattsleung.github.io/Student-Outlook/
publish_mode: editorial_workflow
show_preview_links: false

media_folder: public/article-media
public_folder: /Student-Outlook/article-media

collections:
  - name: article_drafts
    label: Articles
    label_singular: Article
    description: Paste finished Google Docs articles here. Save unfinished Decap entries as drafts; when everything is complete, choose Ready to Review once. The owner's In Review column is the final-approval queue.
    folder: content/submissions
    create: true
    delete: false
    extension: md
    format: frontmatter
    identifier_field: title
    slug: "{{slug}}"
    summary: "{{title}} — {{author}}"
    sortable_fields: [title, dateIso, category]
    editor:
      preview: false
    fields:
      - label: Title
        name: title
        widget: string
        pattern: ['^.{5,100}$', "Use a title between 5 and 100 characters."]
        hint: Use a clear title that tells readers what the article is about.
      - label: Author display name
        name: author
        widget: string
        hint: Use a first name and last initial, such as Jordan P. Never enter private contact information.
      - label: Title image (optional)
        name: titleImage
        widget: image
        required: false
        choose_url: false
        media_library:
          config:
            multiple: false
        hint: Upload one JPG, PNG, WebP, or AVIF title image no larger than 5 MB, or leave this blank to use the artwork choice below. Do not upload an identifiable photo of a student without documented permission.
      - label: Title image description
        name: titleImageAlt
        widget: string
        required: false
        pattern: ['^.{5,160}$', "Describe the image in 5 to 160 characters."]
        hint: If you upload a title image, briefly describe what it shows for readers who cannot see it.
      - label: Category
        name: category
        widget: select
        options:
          - Study Tips
          - Social Tips
          - Student Stories
          - Entertainment
      - label: Short summary
        name: summary
        widget: text
        pattern: ['^[\s\S]{20,220}$', "Use a summary between 20 and 220 characters."]
        hint: Write one or two short sentences for the article card.
      - label: Publication date
        name: dateIso
        widget: datetime
        date_format: MMMM D, YYYY
        time_format: false
        format: YYYY-MM-DD
        hint: The owner will confirm this date before publication.
      - label: Article artwork
        name: artwork
        widget: select
        default: default
        options:
          - label: Student Outlook default artwork
            value: default
          - label: No artwork
            value: none
        hint: This is used only when no title image is uploaded. Default artwork uses an automatically selected Student Outlook color.
      - label: Suggest as the featured article
        name: featured
        widget: boolean
        default: false
        required: false
        hint: The owner makes the final decision before publishing.
      - label: Article
        name: body
        widget: richtext
        buttons: [bold, italic, heading-two, bulleted-list]
        editor_components: []
        modes: [rich_text]
        sanitize_preview: true
        hint: Drafts may be publicly visible on GitHub. Never include private information, school names, schedules, addresses, or exact locations.
  - name: published_articles
    label: Published
    label_singular: Published article
    description: Read articles that are already on the public website. Only mattsleung can change or remove them.
    folder: content/articles
    create: false
    delete: false
    publish: false
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} — {{author}}"
    sortable_fields: [title, dateIso, category]
    editor:
      preview: false
    fields:
      - { label: Title, name: title, widget: published-readonly }
      - { label: Author display name, name: author, widget: published-readonly }
      - { label: Title image, name: titleImage, widget: published-readonly, required: false }
      - { label: Title image description, name: titleImageAlt, widget: published-readonly, required: false }
      - { label: Category, name: category, widget: published-readonly }
      - { label: Short summary, name: summary, widget: published-readonly }
      - { label: Publication date, name: dateIso, widget: published-readonly }
      - { label: Article artwork, name: artwork, widget: published-readonly, required: false }
      - { label: Featured article, name: featured, widget: published-readonly, required: false }
      - { label: Article, name: body, widget: published-readonly }
