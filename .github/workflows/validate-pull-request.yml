name: Validate Student Outlook changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate article title-image uploads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          deleted_media=$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- public/article-media)
          if [ -n "$deleted_media" ] && [ "${PR_AUTHOR,,}" != "mattsleung" ]; then
            echo "Only mattsleung may delete article media."
            exit 1
          fi

          while IFS= read -r image; do
            [ -z "$image" ] && continue
            case "${image,,}" in
              *.avif|*.jpg|*.jpeg|*.png|*.webp) ;;
              *) echo "Unsupported article image type: $image"; exit 1 ;;
            esac

            size=$(stat -c%s "$image")
            if [ "$size" -gt 5242880 ]; then
              echo "Article title images must be no larger than 5 MB: $image"
              exit 1
            fi

            mime=$(file --brief --mime-type "$image")
            case "$mime" in
              image/avif|image/jpeg|image/png|image/webp) ;;
              *) echo "File contents are not a supported image: $image ($mime)"; exit 1 ;;
            esac
          done < <(git diff --diff-filter=AM --name-only "$BASE_SHA" "$HEAD_SHA" -- public/article-media)

      - name: Protect published articles
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/validate-published-changes.mjs "$BASE_SHA" "$HEAD_SHA" "$PR_AUTHOR"

      - name: Run ESLint
        run: npm run lint

      - name: Test writer authentication
        run: npm run test:auth

      - name: Test the publishing workflow
        run: npm run test:publishing

      - name: Check TypeScript
        run: npm run typecheck

      - name: Prepare draft articles for build validation
        run: node scripts/promote-submissions.mjs

      - name: Build the complete website
        run: npm run build
